# dsh bundle patch: inserts this plugin into a profile's layer stack.
#
# Optional config keys (the loader passes only this sub-object to the plugin):
#   - id: dsh-launcher
#     name: 'dsh-launcher'
#     config:
#       install: true          # copy/repair the launcher files
#       shortcut: true         # create/repair the desktop shortcut
#       shortcutPath: 'C:\Users\me\Desktop\dsh.lnk'
#       workspaceRoot: 'D:\dsh'
- insert:
    - id: dsh-launcher
      name: 'dsh-launcher'
